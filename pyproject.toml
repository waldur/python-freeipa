[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "python-freeipa"
version = "1.0.9"
description = "Lightweight FreeIPA client"
readme = "README.md"
authors = [{ name = "OpenNode Team", email = "info@opennodecloud.com" }]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["freeipa", "ipa", "authentication", "directory"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
]

# Require always
dependencies = [
  "requests",
]

# Optional dependencies exposed as extras
[project.optional-dependencies]
gssapi = ["requests-gssapi"]
srv = ["srvlookup"]
all = [
  "requests-gssapi",
  "srvlookup",
]

[project.urls]
Documentation = "https://python-freeipa.readthedocs.io/"
Homepage = "https://python-freeipa.readthedocs.io/"

# Package discovery (PEP 621 backends may use tool-specific config; Poetry needs this)
[tool.poetry]
packages = [{ include = "python_freeipa", from = "src" }]

[tool.poetry.group.test.dependencies]
responses = "*"
pytest = "^8.3.4"
pytest-cov = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.49"
mkdocstrings = "^0.27.0"
mkdocstrings-python = "^1.12.2"

[tool.pytest.ini_options]
addopts = "--cov=src/python_freeipa/"
